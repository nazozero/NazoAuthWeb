name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
            test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Require tested UI for this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/resolve-ci-run.mjs >> "$GITHUB_OUTPUT"
      - name: Download the exact tested archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ci.outputs.artifact_id }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded archive
        run: test -s nazoauth-web.tar.gz
      - name: Attest UI archive provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: nazoauth-web.tar.gz
      - name: Publish the single UI release artifact
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            nazoauth-web.tar.gz
