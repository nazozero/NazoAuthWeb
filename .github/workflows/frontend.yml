name: Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontend.yml'
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'tests/**'
      - '.nvmrc'
      - 'eslint.config.js'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'src/**'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
  pull_request:
    paths:
      - '.github/workflows/frontend.yml'
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'tests/**'
      - '.nvmrc'
      - 'eslint.config.js'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'src/**'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm test
      - name: Package the tested production UI
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nazoauth-web-${{ github.sha }}
          path: nazoauth-web.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true
